{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pe-agent.fullname" . }}
  labels:
    {{- include "pe-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pe-agent.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 8000}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 14 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.database.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.database.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.database.port }}
    {{- range .Values.networkPolicy.platformCidrs }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
            {{- with .except }}
            except: {{ toYaml . | nindent 14 }}
            {{- end }}
      ports:
        - {protocol: TCP, port: 443}
    {{- end }}
{{- end }}
