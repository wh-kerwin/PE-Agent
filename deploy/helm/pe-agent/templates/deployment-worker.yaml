apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pe-agent.fullname" . }}-worker
  labels:
    {{- include "pe-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      {{- include "pe-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "pe-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "pe-agent.podSecurityContext" . | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m"]
          args: ["pe_agent.worker"]
          env:
            {{- include "pe-agent.env" . | nindent 12 }}
          {{- with .Values.runtimeSecrets.secretName }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          securityContext:
            {{- include "pe-agent.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
