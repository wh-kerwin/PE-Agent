name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PE_AGENT_PLATFORM_PROFILE: mock
  PE_AGENT_DECISION_PROFILE: recorded
  PE_AGENT_ENVIRONMENT: test
  RUN_TYPESAFE_LIVE: "0"

jobs:
  contracts-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pe_agent
          POSTGRES_PASSWORD: pe_agent
          POSTGRES_DB: pe_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pe_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m pip install -e "backend[dev]"
      - run: python scripts/validate_contracts.py
      - run: python -m ruff check backend/src backend/tests scripts
      - run: python -m mypy --config-file backend/pyproject.toml backend/src
      - run: python -m pytest backend/tests -q
        env:
          PE_AGENT_DATABASE_URL: postgresql+asyncpg://pe_agent:pe_agent@localhost:5432/pe_agent

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run test:unit
      - run: npm --prefix frontend run build
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: python -m pip install -r scripts/requirements.txt
      - run: docker compose -f deploy/compose.yaml -f deploy/compose.mock-recorded.yaml config
      - run: helm lint deploy/helm/pe-agent
      - run: helm template pe-agent deploy/helm/pe-agent > rendered.yaml
      - run: python scripts/validate_deploy.py
      - run: python scripts/preflight.py --profile mock-recorded

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
